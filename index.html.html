<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mute:#5b6b82;--line:#d9e1ea;--teal:#0f8b8d;--amber:#d98e1f;--red:#c0412c;--soft:#e3f1f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16223a;--ink:#e8eef7;--mute:#97a6bd;--line:#26344f;--teal:#3cc3c5;--amber:#f0b252;--red:#ef7b64;--soft:#143a45}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16223a;--ink:#e8eef7;--mute:#97a6bd;--line:#26344f;--teal:#3cc3c5;--amber:#f0b252;--red:#ef7b64;--soft:#143a45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.top h1{font-size:26px}.top p{margin:2px 0 0;color:var(--mute)}
.gpa{display:flex;align-items:baseline;gap:10px}
.gpa b{font:700 64px/1 "Bricolage Grotesque",sans-serif;color:var(--teal)}
.gpa span{color:var(--mute);max-width:130px;line-height:1.3}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:820px){.c4,.c5,.c7,.c8{grid-column:span 12}.gpa b{font-size:52px}}
.card h2{font-size:17px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat b{display:block;font:700 26px/1.1 "Bricolage Grotesque",sans-serif}.stat span{color:var(--mute);font-size:13px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:4px;background:var(--line);min-width:90px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.bar.low i{background:var(--red)}.bar.mid i{background:var(--amber)}
.grade{font-weight:600;display:inline-block;min-width:26px;text-align:center;border-radius:6px;background:var(--soft);padding:1px 6px}
ul{list-style:none;margin:0;padding:0}
li.task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
li.task:last-child{border-bottom:0}
li.task input{margin-top:4px;width:17px;height:17px;accent-color:var(--teal)}
li.task .t{flex:1;min-width:0}li.task .m{color:var(--mute);font-size:13px}
li.done .n{text-decoration:line-through;color:var(--mute)}
.due-soon{color:var(--red);font-weight:600}
button,input[type=text],input[type=date],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer;background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
button.ghost{background:none;color:var(--mute);border:0;padding:2px 6px;font-weight:400}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
form{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
form input[type=text]{flex:1 1 140px;min-width:0}
.tt{display:grid;grid-template-columns:54px repeat(5,1fr);gap:4px;font-size:12px;min-width:520px}
.tt div{padding:6px;border-radius:6px;min-height:36px}
.tt .h{color:var(--mute);font-weight:600;background:none}
.tt .s{background:var(--soft);line-height:1.25}
.tt .e{background:none}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:12px;color:var(--mute)}
.bars i{display:block;width:100%;max-width:44px;background:var(--line);border-radius:6px 6px 0 0}
.bars .now i{background:var(--teal)}
.bars b{color:var(--ink);font-size:13px}
.empty{color:var(--mute);padding:8px 0}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Semester 6 dashboard</h1>
      <p>Your courses, attendance, assignments and timetable in one place.</p>
    </div>
    <div class="gpa"><b id="sgpa">–</b><span>SGPA this semester, from current marks</span></div>
  </div>

  <div class="grid">
    <section class="card c4" aria-labelledby="h-sum">
      <h2 id="h-sum">At a glance</h2>
      <div class="stats">
        <div class="stat"><b id="s-att">–</b><span>Attendance</span></div>
        <div class="stat"><b id="s-open">–</b><span>Open tasks</span></div>
        <div class="stat"><b id="s-cr">–</b><span>Credits</span></div>
      </div>
      <p id="warn" class="empty" style="margin:14px 0 0"></p>
    </section>

    <section class="card c8" aria-labelledby="h-trend">
      <h2 id="h-trend">SGPA by semester</h2>
      <div class="bars" id="trend"></div>
    </section>

    <section class="card c12" aria-labelledby="h-courses">
      <h2 id="h-courses">Courses</h2>
      <div class="scroll"><table>
        <thead><tr><th>Course</th><th>Credits</th><th>Marks</th><th>Grade</th><th>Attendance</th></tr></thead>
        <tbody id="courses"></tbody>
      </table></div>
    </section>

    <section class="card c5" aria-labelledby="h-tasks">
      <h2 id="h-tasks">Assignments</h2>
      <ul id="tasks"></ul>
      <form id="add">
        <input type="text" id="t-name" placeholder="New assignment" aria-label="Assignment name" required>
        <select id="t-course" aria-label="Course"></select>
        <input type="date" id="t-due" aria-label="Due date" required>
        <button type="submit">Add assignment</button>
      </form>
    </section>

    <section class="card c7" aria-labelledby="h-tt">
      <h2 id="h-tt">This week</h2>
      <div class="scroll"><div class="tt" id="tt"></div></div>
    </section>
  </div>
</main>

<script>
var COURSES=[
 {code:"CS601",name:"Machine Learning",cr:4,marks:86,att:92},
 {code:"CS602",name:"Data Analytics",cr:3,marks:78,att:84},
 {code:"CS603",name:"Cloud Computing",cr:3,marks:71,att:69},
 {code:"CS604",name:"Software Engineering",cr:3,marks:64,att:88},
 {code:"CS605",name:"ML Lab",cr:2,marks:91,att:96}
];
var TREND=[7.4,7.9,8.1,8.0,8.4];
var TT={Mon:["CS601","CS602","","CS605"],Tue:["CS603","CS604","CS601",""],Wed:["CS602","","CS605","CS605"],Thu:["CS604","CS601","CS603",""],Fri:["CS602","CS603","","CS604"]};
var SLOTS=["9:00","10:00","11:00","2:00"];
var tasks=[
 {n:"Regression mini-project report",c:"CS601",d:"",done:false},
 {n:"Dashboard case study",c:"CS602",d:"",done:false},
 {n:"Cloud deployment lab record",c:"CS603",d:"",done:true}
];
function iso(off){var d=new Date();d.setDate(d.getDate()+off);return d.toISOString().slice(0,10)}
tasks[0].d=iso(2);tasks[1].d=iso(6);tasks[2].d=iso(-3);
try{var saved=JSON.parse(localStorage.getItem("sd-tasks")||"null");if(Array.isArray(saved))tasks=saved}catch(e){}
function save(){try{localStorage.setItem("sd-tasks",JSON.stringify(tasks))}catch(e){}}
function gp(m){return m>=90?10:m>=80?9:m>=70?8:m>=60?7:m>=50?6:0}
function gl(m){return m>=90?"O":m>=80?"A+":m>=70?"A":m>=60?"B+":m>=50?"B":"F"}
function cls(p){return p<75?"bar low":p<85?"bar mid":"bar"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function renderCourses(){
  var cr=0,pts=0,att=0,low=[];
  var rows=COURSES.map(function(c){
    cr+=c.cr;pts+=c.cr*gp(c.marks);att+=c.att;if(c.att<75)low.push(c.name);
    return "<tr><td><b>"+c.code+"</b> "+esc(c.name)+"</td><td>"+c.cr+"</td><td>"+c.marks+"/100</td>"+
      "<td><span class='grade'>"+gl(c.marks)+"</span></td>"+
      "<td><div style='display:flex;gap:8px;align-items:center'><div class='"+cls(c.att)+"' style='flex:1'><i style='width:"+c.att+"%'></i></div><span>"+c.att+"%</span></div></td></tr>";
  }).join("");
  document.getElementById("courses").innerHTML=rows;
  var sg=(pts/cr).toFixed(2);
  document.getElementById("sgpa").textContent=sg;
  document.getElementById("s-att").textContent=Math.round(att/COURSES.length)+"%";
  document.getElementById("s-cr").textContent=cr;
  document.getElementById("warn").textContent=low.length?"Attendance is below 75% in "+low.join(", ")+". Attend upcoming classes to avoid a shortage.":"Attendance is above 75% in every course.";
  var all=TREND.concat([+sg]);
  document.getElementById("trend").innerHTML=all.map(function(v,i){
    var last=i===all.length-1;
    return "<div class='"+(last?"now":"")+"'><b>"+v.toFixed(2)+"</b><i style='height:"+Math.round((v-5)/5*100)+"%'></i>Sem "+(i+1)+"</div>";
  }).join("");
}

function renderTasks(){
  var el=document.getElementById("tasks");
  tasks.sort(function(a,b){return a.done-b.done||a.d.localeCompare(b.d)});
  if(!tasks.length){el.innerHTML="<li class='empty'>No assignments yet. Add one below.</li>"}
  else el.innerHTML=tasks.map(function(t,i){
    var days=Math.round((new Date(t.d)-new Date(iso(0)))/864e5);
    var when=t.done?"Done":days<0?"Overdue by "+(-days)+" d":days===0?"Due today":"Due in "+days+" d";
    var soon=!t.done&&days<=2?" due-soon":"";
    return "<li class='task"+(t.done?" done":"")+"'><input type='checkbox' data-i='"+i+"' "+(t.done?"checked":"")+" aria-label='Mark done'>"+
      "<div class='t'><div class='n'>"+esc(t.n)+"</div><div class='m'>"+esc(t.c)+" · <span class='"+soon+"'>"+when+"</span></div></div>"+
      "<button class='ghost' data-del='"+i+"' aria-label='Delete assignment'>Delete</button></li>";
  }).join("");
  document.getElementById("s-open").textContent=tasks.filter(function(t){return !t.done}).length;
}

function renderTT(){
  var h="<div class='h'></div>"+Object.keys(TT).map(function(d){return "<div class='h'>"+d+"</div>"}).join("");
  SLOTS.forEach(function(s,r){
    h+="<div class='h'>"+s+"</div>";
    Object.keys(TT).forEach(function(d){
      var code=TT[d][r],c=COURSES.filter(function(x){return x.code===code})[0];
      h+=c?"<div class='s'><b>"+c.code+"</b><br>"+esc(c.name)+"</div>":"<div class='e'></div>";
    });
  });
  document.getElementById("tt").innerHTML=h;
}

document.getElementById("t-course").innerHTML=COURSES.map(function(c){return "<option>"+c.code+"</option>"}).join("");
document.getElementById("t-due").value=iso(7);
document.getElementById("tasks").addEventListener("click",function(e){
  var i=e.target.getAttribute("data-i"),d=e.target.getAttribute("data-del");
  if(i!==null){tasks[+i].done=e.target.checked}
  else if(d!==null){tasks.splice(+d,1)}else return;
  save();renderTasks();
});
document.getElementById("add").addEventListener("submit",function(e){
  e.preventDefault();
  var n=document.getElementById("t-name");
  tasks.push({n:n.value.trim(),c:document.getElementById("t-course").value,d:document.getElementById("t-due").value,done:false});
  n.value="";save();renderTasks();
});
renderCourses();renderTasks();renderTT();
</script>
</body>
</html>
